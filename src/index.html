<!doctype html>
<html lang="en">
  <head>

    />
    <meta

    <title>Moyo header</title>
    <link
      rel="stylesheet"
      href="./style.css"
    />
    <link

    />

            <li class="item">
              <a
                href="#"

            <li class="item">
              <a
                href="#"
                class="link"
              >
                SMARTPHONES

            <li class="item">
              <a
                href="#"

            </li>
            <li class="item">
              <a
                href="#"
                class="link"

                GADGETS
              </a>
            </li>
            <li class="item">
              <a
                href="#"
                class="link"
              >
                TABLETS
              </a>
            </li>
            <li class="item">
              <a
                href="#"
                class="link"
              >
                PHOTO
              </a>
            </li>
            <li class="item">
              <a
                href="#"
                class="link"
              >
                VIDEO
              </a>
            </li>
          </ul>
        </nav>

</html>
